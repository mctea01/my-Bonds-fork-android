name: Google Play

# Publishes the release App Bundle of a GitHub release (the "nightly" pre-release by default) to Google Play with its R8
# mapping and release notes made by tools/release-notes.py from the same changes as the GitHub release (the commits up
# to the release's tag, with the tools and listing of the branch this workflow runs on). A manual run
# picks the track and status, and can also write the store listing of distribution/play/listing. Running again for
# a version Play already has (same SHA-256) does not upload the bundle again: it writes the release of the track again
# with the current release notes. With the repository variable PLAY_AUTO_TRACK set (for example internal), every
# successful CI run of a push to main also uploads its nightly there. The first bundle of the app is uploaded by hand
# in Play Console. Setup: docs/google-play.md.
on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track (alpha is closed testing, beta is open testing)
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: Release status (an app that was never published accepts only draft)
        type: choice
        options: [draft, completed, inProgress]
        default: draft
      user_fraction:
        description: Staged rollout fraction for inProgress, between 0 and 1 (for example 0.1)
        required: false
      tag:
        description: GitHub release that holds the App Bundle (nightly, or a stable tag such as v0.5.25)
        default: nightly
      bundle:
        description: Publish the App Bundle and its release notes to the track
        type: boolean
        default: true
      listing:
        description: Also write the store listing (title, short and full description of every language)
        type: boolean
        default: false
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One upload at a time. A waiting run is not cancelled, so a version is never skipped by accident.
concurrency:
  group: google-play
  cancel-in-progress: false

jobs:
  upload:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && vars.PLAY_AUTO_TRACK != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The secret can live on this environment, and its protection rules (required reviewers) gate every upload.
    environment: google-play
    env:
      PLAY_PACKAGE: diw.wallet.app
      TAG: ${{ inputs.tag || 'nightly' }}
      TRACK: ${{ inputs.track || vars.PLAY_AUTO_TRACK }}
      STATUS: ${{ inputs.status || vars.PLAY_AUTO_STATUS || 'draft' }}
      USER_FRACTION: ${{ inputs.user_fraction }}
      BUNDLE: ${{ github.event_name == 'workflow_run' || inputs.bundle }}
      LISTING: ${{ github.event_name == 'workflow_dispatch' && inputs.listing }}
    steps:
      # Full history and tags: the release notes are the commits since the previous stable tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check settings
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON is not set (docs/google-play.md)"
            exit 1
          fi
          if ! printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["type"]=="service_account" and d["client_email"]' 2> /dev/null; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not the JSON key of a service account"
            exit 1
          fi
          if [ "$BUNDLE" != "true" ] && [ "$LISTING" != "true" ]; then
            echo "::error::Nothing to do: choose bundle, listing or both"
            exit 1
          fi
          case "$STATUS" in
            inProgress)
              if [ -z "$USER_FRACTION" ]; then echo "::error::Status inProgress needs user_fraction"; exit 1; fi ;;
            draft|completed) ;;
            *)
              echo "::error::Unknown status $STATUS (PLAY_AUTO_STATUS takes draft or completed)"; exit 1 ;;
          esac
          echo "Track $TRACK, status $STATUS, release $TAG, bundle $BUNDLE, listing $LISTING"
      - name: Release files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # After a CI run, upload only the nightly that this run published; a newer push may already have replaced it.
          git fetch --force --tags origin
          target=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ -n "$RUN_SHA" ] && [ "$target" != "$RUN_SHA" ]; then
            echo "::notice::Release $TAG is at $target, not at $RUN_SHA of this CI run: nothing uploaded"
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # The tools and the listing stay at the commit of this workflow; release notes are the changes up to the
          # commit of the release, as in the GitHub release body (also for releases older than the tools).
          echo "TARGET=$target" >> "$GITHUB_ENV"
          mkdir -p dist
          gh release download "$TAG" --dir dist --pattern 'DIW-MY-WALLET-*.aab' --pattern 'DIW-MY-WALLET-*-mapping.txt'
          rm -f dist/*-debug.aab
          ls -l dist
          set -- dist/*.aab
          if [ $# -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::Release $TAG needs exactly one release .aab (DIW-MY-WALLET-<version>.aab)"
            exit 1
          fi
          version=$(basename "$1" .aab)
          version=${version#DIW-MY-WALLET-}
          echo "AAB=$1" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=$version" >> "$GITHUB_ENV"
          if [ -f "dist/DIW-MY-WALLET-$version-mapping.txt" ]; then
            echo "MAPPING=dist/DIW-MY-WALLET-$version-mapping.txt" >> "$GITHUB_ENV"
          else
            echo "::warning::No R8 mapping in release $TAG: crash reports in Play Console stay obfuscated"
          fi
      - name: Release notes
        if: env.SKIP != '1'
        run: |
          # OpenCC writes the Simplified Chinese notes; without it they keep the Traditional commit subjects.
          python3 -m venv /tmp/play-venv
          /tmp/play-venv/bin/pip install --quiet opencc || echo "::warning::OpenCC not installed: zh-CN notes stay Traditional"
          case "$TAG" in v[0-9]*) channel=stable ;; *) channel=nightly ;; esac
          /tmp/play-venv/bin/python -I tools/release-notes.py --channel "$channel" --version "$RELEASE_NAME" --tag "$TAG" --ref "$TARGET" --play-out whatsnew
          python3 -I tools/play-store.py check
          for f in whatsnew/*; do echo "== $f"; cat "$f"; done
      - name: Publish to Google Play
        if: env.SKIP != '1'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -- --package "$PLAY_PACKAGE"
          if [ "$BUNDLE" = "true" ]; then
            set -- "$@" --aab "$AAB" --track "$TRACK" --status "$STATUS" --name "$RELEASE_NAME" --whatsnew whatsnew
            if [ -n "$MAPPING" ]; then set -- "$@" --mapping "$MAPPING"; fi
            if [ "$STATUS" = "inProgress" ]; then set -- "$@" --fraction "$USER_FRACTION"; fi
          fi
          if [ "$LISTING" = "true" ]; then set -- "$@" --listing; fi
          python3 -I tools/play-store.py publish "$@"
