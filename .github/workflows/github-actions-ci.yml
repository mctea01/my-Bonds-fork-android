name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  LANG: C.UTF-8
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
  APP_VERSION: 0.1.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Optional: base64 of a debug.keystore so every APK has the same signature and installs over the previous one.
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Core and protocol tests
        run: ./gradlew --no-daemon --stacktrace --continue :core:allTests :test-servers:test
      - name: App flow tests (desktop)
        if: success() || failure()
        run: ./gradlew --no-daemon --stacktrace --continue :app:desktopTest
      - name: Debug signing key
        if: success() || failure()
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Using the debug keystore from secrets"
          fi
      - name: Android debug APK
        if: success() || failure()
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/DIW-MY-WALLET-$APP_VERSION-debug.apk"
      # Failed tests appear as annotations on the PR "Files changed" tab and in the run summary.
      - name: Test report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: "**/build/test-results/**/*.xml"
          include_passed: false
          detailed_summary: true
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Upload test results and reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/
            build/reports/problems/
          retention-days: 14
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android
          path: dist/*.apk
          retention-days: 14

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            tasks: ":app:packageMsi :app:packageUberJarForCurrentOS"
          - os: ubuntu-latest
            name: linux
            tasks: ":app:packageDeb :app:packageUberJarForCurrentOS"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install deb tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q fakeroot
      - name: Package ${{ matrix.name }}
        run: ./gradlew --no-daemon --stacktrace "-Pdiw.desktopVersion=$APP_VERSION" ${{ matrix.tasks }}
      - name: Collect files
        run: |
          mkdir -p dist
          find app/build/compose/binaries/main -type f \( -name '*.msi' -o -name '*.deb' \) -exec cp {} dist/ \;
          cp app/build/compose/jars/*.jar dist/
          ls -l dist
      - name: Upload ${{ matrix.name }} files
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          retention-days: 14

  # Every push to main replaces the "nightly" pre-release; release files are downloaded as-is, not zipped.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish nightly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          cat > notes.md <<EOF
          Automatic build of main at ${GITHUB_SHA::7} (version $APP_VERSION). Test build, not for production use.

          - Android: DIW-MY-WALLET-$APP_VERSION-debug.apk (install directly)
          - Windows: .msi installer, no admin rights needed
          - Linux: .deb package (Debian, Ubuntu)
          - Any OS with Java 21: DIW-MY-WALLET-<os>-<arch>-$APP_VERSION.jar, run with java -jar
          EOF
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* --prerelease --target "$GITHUB_SHA" --title "Nightly $APP_VERSION" --notes-file notes.md
