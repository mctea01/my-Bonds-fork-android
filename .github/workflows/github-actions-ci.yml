name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LANG: C.UTF-8
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Core and protocol tests
        run: ./gradlew --no-daemon --stacktrace --continue :core:allTests :test-servers:test
      - name: App flow tests (desktop)
        if: success() || failure()
        run: ./gradlew --no-daemon --stacktrace --continue :app:desktopTest
      - name: Android debug APK
        if: success() || failure()
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      # Failed tests appear as annotations on the PR "Files changed" tab and in the run summary.
      - name: Test report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: "**/build/test-results/**/*.xml"
          include_passed: false
          detailed_summary: true
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Upload test results and reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/
            build/reports/problems/
          retention-days: 14
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
