name: P4 OpenAC native acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # cmdline-tools 16.0 no longer has the "tools" package that the action installs by default.
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-29
        with:
          toolchain: 1.90.0
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install native and graph build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev protobuf-compiler
          corepack enable
          mkdir -p "$RUNNER_TEMP/circom-bin"
          curl -fsSL https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64 -o "$RUNNER_TEMP/circom-bin/circom"
          echo "85342c7ff332d948df7c0c50ecf201e6129349aef550ce873f3c811b79fe53a3  $RUNNER_TEMP/circom-bin/circom" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/circom-bin/circom"
          echo "$RUNNER_TEMP/circom-bin" >> "$GITHUB_PATH"
          cargo install cargo-ndk --version 4.1.2 --locked
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Build and verify separate GPL graph assets
        run: ./native/openac-age/build-graphs.sh
      - name: Check wasm reference vectors and normal runtime licenses
        shell: bash
        run: |
          python3 -I native/openac-age/tests/generate_self_test.py
          python3 -I native/openac-age/tests/generate_wasm_vectors.py
          python3 -I native/openac-age/audit-runtime.py
          python3 -I native/openac-age/install_assets.py native/openac-age/build/assets/circom
      - name: Build the graph runtime and both Android ABIs
        run: ./native/openac-age/build.sh host,android
      - name: Run native and synthetic witness/proof tests
        shell: bash
        env:
          OPENAC_TEST_ASSETS: ${{ github.workspace }}/native/openac-age/build/assets/circom
          OPENAC_FFI_OUTPUT: ${{ github.workspace }}/native/openac-age/build/ffi-proof/circom
        run: |
          cargo test --release --locked --manifest-path native/Cargo.toml --target x86_64-unknown-linux-gnu -p diw-zk-ffi --features openac
          cargo test --release --locked --manifest-path native/Cargo.toml --target x86_64-unknown-linux-gnu -p openac-age
          cargo test --release --locked --manifest-path native/Cargo.toml --target x86_64-unknown-linux-gnu -p openac-age -- --ignored --nocapture
          python3 -I native/openac-age/tests/verify_ffi.py native/openac-age/build/python "$OPENAC_FFI_OUTPUT" --assets "$OPENAC_TEST_ASSETS"
