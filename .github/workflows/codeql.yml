name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          # The GitHub Actions workflows themselves.
          - language: actions
            build-mode: none
          # The Kotlin/Java code: core, app (Android + desktop) and test-servers.
          - language: java-kotlin
            build-mode: manual
          # The zero-knowledge native runtime in native/ (Rust workspace: diw-zk-ffi,
          # zkpdf-prover, zktls, openac-age). Rust only has a buildless extractor; it loads
          # the workspace through cargo metadata, so the pinned toolchain and the crate
          # sources are prepared below. The Noir circuits have no CodeQL analyzer.
          - language: rust
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      # The extractor picks the default toolchain at the repository root, not the one
      # pinned in native/rust-toolchain.toml, so make the pinned one (with rust-src for
      # the standard library sources) the default and fetch the locked crates up front.
      - name: Set up Rust
        if: matrix.language == 'rust'
        working-directory: native
        run: |
          toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component rust-src
          rustup default "$toolchain"
          cargo fetch --locked

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          # Vendored third-party Rust, the upstream copies kept under openac-age/patches
          # (not compiled), generated build output, docs and the Noir circuits carry no
          # findings worth reporting for this project.
          config: |
            paths-ignore:
              - docs/**
              - '**/build/**'
              - native/**/vendor/**
              - native/circuits/**
              - native/openac-age/patches/**

      # Compile the main source sets so the extractor sees them, without building the
      # Rust native library (DIW_ZK_NATIVE=skip): the Android SDK on the runner builds
      # the Android variant, the desktop target covers desktopMain, and the JVM target
      # covers commonMain and the native-binding Kotlin in jvmCommonMain.
      - name: Build Java/Kotlin
        if: matrix.language == 'java-kotlin'
        env:
          DIW_ZK_NATIVE: skip
        run: |
          chmod +x ./gradlew
          ./gradlew \
            --no-daemon \
            --no-build-cache \
            --stacktrace \
            :core:compileKotlinJvm \
            :app:compileKotlinDesktop \
            :app:compileDebugKotlinAndroid \
            :test-servers:classes

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:${{ matrix.language }}"
