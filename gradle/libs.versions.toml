[versions]
multipaz = "0.101.0"
ktor = "3.3.3"
coroutines = "1.10.2"
serialization = "1.9.0"
kotlinxIo = "0.8.2"
bouncycastle = "1.85"
jna = "5.17.0"

[libraries]
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
multipaz = { module = "org.multipaz:multipaz", version.ref = "multipaz" }
multipaz-doctypes = { module = "org.multipaz:multipaz-doctypes", version.ref = "multipaz" }
multipaz-compose = { module = "org.multipaz:multipaz-compose", version.ref = "multipaz" }
multipaz-dcapi = { module = "org.multipaz:multipaz-dcapi", version.ref = "multipaz" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-io = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinxIo" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-java = { module = "io.ktor:ktor-client-java", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
# Android's bundled DOM rejects non-ASCII element and DOCTYPE names (Chinese official documents).
xerces = { module = "xerces:xercesImpl", version = "2.12.2" }
xml-apis = { module = "xml-apis:xml-apis", version = "1.4.01" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version = "3.51.2.0" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version = "1.10.1" }
androidx-fragment = { module = "androidx.fragment:fragment-ktx", version = "1.8.9" }
androidx-browser = { module = "androidx.browser:browser", version = "1.8.0" }
androidx-credentials = { module = "androidx.credentials:credentials", version = "1.5.0" }
androidx-credentials-registry = { module = "androidx.credentials.registry:registry-provider", version = "1.0.0-alpha03" }
# Same version multipaz-dcapi registers with; used directly to await the registration result.
play-services-identity-credentials = { module = "com.google.android.gms:play-services-identity-credentials", version = "16.0.0-alpha08" }
