# The release line (major.minor), the only version kept in the repository. The Stable release workflow
# (tools/stable-release.sh) changes it when it starts a new line; it can also be changed by hand in a pull request.
# Builds add the patch: the number of commits since the commit that last changed this line, so it restarts at 0.
# Android versionCode = major * 1,000,000 + minor * 10,000 + patch. See docs/release.md.
version=0.5
