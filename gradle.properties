org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# AGP 9 no longer lets the Kotlin Multiplatform plugin share a module with com.android.application or
# com.android.library under its built-in Kotlin and new DSL. Both opt-outs keep core and app as they are until they
# move to com.android.kotlin.multiplatform.library and a separate Android app module (required before AGP 10).
android.builtInKotlin=false
android.newDsl=false
