[workspace]
members = ["diw-zk-ffi", "zkpdf-prover", "zktls", "openac-age"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
uniffi = "=0.32.2"
sha2 = "=0.11.1"
thiserror = "=2.0.21"

[profile.release]
lto = "thin"
strip = "debuginfo"
panic = "unwind"
