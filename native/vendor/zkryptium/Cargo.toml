# Vendored copy of zkryptium 0.8.1 (crates.io, Apache-2.0, Fondazione LINKS) with the W3C bbs-2023
# pseudonym changes described in README.md. Only the BBS features are kept.
[package]
name = "zkryptium"
version = "0.8.1"
edition = "2021"
rust-version = "1.65"
license = "Apache-2.0"
description = "zkryptium 0.8.1 BBS signatures, patched for W3C bbs-2023 pseudonyms"
repository = "https://github.com/Cybersecurity-LINKS/zkryptium"
publish = false

[lib]
name = "zkryptium"
path = "src/lib.rs"

[features]
default = ["bbsplus", "bbsplus_blind", "bbsplus_nym"]
bbsplus = ["dep:bls12_381_plus"]
bbsplus_blind = ["bbsplus"]
bbsplus_nym = ["bbsplus", "bbsplus_blind"]

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("cl03"))'] }

[dependencies]
bls12_381_plus = { version = "0.8.13", optional = true }
digest = "0.10.6"
elliptic-curve = "0.13.4"
ff = "0.13.1"
group = "0.13.0"
hex = "0.4.3"
rand = "0.8.5"
serde = { version = "1.0.25", default-features = false, features = ["derive", "serde_derive"] }
serde_json = "1.0.59"
sha2 = "0.10.6"
sha3 = "0.10.8"
thiserror = "2.0.12"
