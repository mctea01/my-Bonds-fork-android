[package]
name = "zkpassport-ffi"
description = "C ABI for zkpassport-core (App Clip / iOS / Android input generation)"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/zkpassport/zkpassport-packages"

[dependencies]
zkpassport-core = { path = "../zkpassport-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
num-bigint = "0.4"
hex = "0.4"

[dependencies.zkpassport-bridge]
path = "../zkpassport-bridge"
