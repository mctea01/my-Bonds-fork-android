[package]
name = "diw-zk-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "diw_zk"
crate-type = ["cdylib", "rlib"]

[features]
default = []
bindgen = ["uniffi/cli"]
zkpdf = ["dep:zkpdf-prover", "zkpdf-prover/bb"]
tlsn = ["dep:zktls"]
openac = ["dep:openac-age"]

[dependencies]
uniffi.workspace = true
sha2.workspace = true
thiserror.workspace = true
zkpdf-prover = { path = "../zkpdf-prover", optional = true }
zktls = { path = "../zktls", optional = true }
openac-age = { path = "../openac-age", optional = true }
# BBS for bbs-2023, always built: see ../vendor/zkryptium/README.md for the W3C pseudonym patch.
zkryptium = { path = "../vendor/zkryptium", default-features = false, features = ["bbsplus", "bbsplus_blind", "bbsplus_nym"] }

[dev-dependencies]
serde_json = "1"
hex = "0.4"

[[bin]]
name = "uniffi-bindgen"
path = "src/bindgen.rs"
required-features = ["bindgen"]
