[package]
name = "diw-zk-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "diw_zk"
crate-type = ["cdylib", "rlib"]

[features]
default = []
bindgen = ["uniffi/cli"]
zkpdf = ["dep:zkpdf-prover", "zkpdf-prover/bb", "dep:zkpassport-verify", "dep:zkpassport-ffi", "dep:serde_json", "dep:hex", "dep:base64", "oprf"]
# The project OPRF (zkPassport 5.5): light, no Barretenberg; zkPassport proving turns it on.
oprf = ["dep:taceo-oprf-core", "dep:taceo-poseidon2", "dep:ark-babyjubjub", "dep:ark-ec", "dep:ark-ff", "dep:num-bigint", "dep:rand", "dep:serde_json"]
tlsn = ["dep:zktls"]
openac = ["dep:openac-age"]

[dependencies]
uniffi.workspace = true
sha2.workspace = true
thiserror.workspace = true
zkpdf-prover = { path = "../zkpdf-prover", optional = true }
zktls = { path = "../zktls", optional = true }
openac-age = { path = "../openac-age", optional = true }
zkpassport-verify = { path = "../zkpassport-verify", optional = true }
# zkPassport's own input generation and session driver (MIT), vendored from a reviewed revision.
zkpassport-ffi = { path = "../vendor/zkpassport/zkpassport-ffi", optional = true }
serde_json = { version = "=1.0.154", optional = true }
hex = { version = "0.4", optional = true }
base64 = { version = "=0.23.1", optional = true }
taceo-oprf-core = { version = "=0.6.3", default-features = false, optional = true }
taceo-poseidon2 = { version = "0.3", default-features = false, features = ["bn254", "t4"], optional = true }
ark-babyjubjub = { package = "taceo-ark-babyjubjub", version = "0.6", optional = true }
ark-ec = { version = "0.6", optional = true }
ark-ff = { version = "0.6", optional = true }
num-bigint = { version = "0.4", optional = true }
rand = { version = "0.8", optional = true }
# JPEG 2000 chip photos (Apache-2.0 OR MIT, pure Rust); always built, it needs no proof backend.
hayro-jpeg2000 = { version = "=0.5.0", default-features = false, features = ["std", "simd"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bindgen.rs"
required-features = ["bindgen"]
