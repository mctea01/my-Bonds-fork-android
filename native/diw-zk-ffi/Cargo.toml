[package]
name = "diw-zk-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "diw_zk"
crate-type = ["cdylib", "rlib"]

[features]
default = []
bindgen = ["uniffi/cli"]
zkpdf = ["dep:zkpdf-prover", "zkpdf-prover/bb", "dep:zkpassport-verify", "dep:zkpassport-ffi", "dep:serde_json", "dep:hex", "dep:base64"]
tlsn = ["dep:zktls"]
openac = ["dep:openac-age"]

[dependencies]
uniffi.workspace = true
sha2.workspace = true
thiserror.workspace = true
zkpdf-prover = { path = "../zkpdf-prover", optional = true }
zktls = { path = "../zktls", optional = true }
openac-age = { path = "../openac-age", optional = true }
zkpassport-verify = { path = "../zkpassport-verify", optional = true }
# zkPassport's own input generation and session driver (MIT), vendored from a reviewed revision.
zkpassport-ffi = { path = "../third_party/zkpassport/zkpassport-ffi", optional = true }
serde_json = { version = "=1.0.154", optional = true }
hex = { version = "0.4", optional = true }
base64 = { version = "=0.23.1", optional = true }

[[bin]]
name = "uniffi-bindgen"
path = "src/bindgen.rs"
required-features = ["bindgen"]
