[package]
name = "zktls"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tlsn = { git = "https://github.com/tlsnotary/tlsn", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec", default-features = false, features = ["mozilla-certs"] }
snow = "=0.9.6"
tokio = { version = "1.48", features = ["rt", "net", "io-util", "time", "sync", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
thiserror.workspace = true
zeroize = "1.8"
tracing = "0.1"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
