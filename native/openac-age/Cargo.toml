[package]
name = "openac-age"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["native-witness"]
native-witness = ["ecdsa-spartan2/native-witness"]

[dependencies]
ecdsa-spartan2 = { path = "vendor/ecdsa-spartan2", default-features = false }
spartan2 = { git = "https://github.com/0xVikasRushi/Spartan2.git", rev = "d687dbb639eccbdd21e62fecec97c5826bc4dbbf", default-features = false }
base64 = "0.22"
chrono = "0.4"
ff = "0.13"
num-bigint = "0.4"
num-traits = "0.2"
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rayon = "1.10"
serde_json = "1.0"
sha2.workspace = true
thiserror.workspace = true

tempfile = "3.8"
