# Copy to .github/workflows/ci.yml to enable (pushing workflow files needs the GitHub "workflow" permission).
name: CI

on:
  push:
    branches: [main, p1-standard-core]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LANG: C.UTF-8
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Core and protocol tests
        run: ./gradlew --no-daemon :core:allTests :test-servers:test
      - name: App flow tests (desktop)
        run: ./gradlew --no-daemon :app:desktopTest
      - name: Android debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: "**/build/reports/tests/"
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
